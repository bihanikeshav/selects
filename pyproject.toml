[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selects"
version = "0.1.14"
description = "Local AI-assisted travel photo and video culling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "click>=8.1",
  "pillow>=10.2",
  "pillow-heif>=0.16",
  "rawpy>=0.21",
  "opencv-python-headless>=4.9,<5",
  "numpy>=1.26",
  "pyexiv2>=2.11",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5.0",
]
ml = [
  # All models run on ONNX Runtime — no torch, transformers, or the
  # recognize-anything package. RAM++ is the ONNX graph in selects-onnx.
  # Windows extra is onnxruntime-directml (DirectML is listed); SigLIP/RAM++
  # graphs are forced CPU. Plain onnxruntime elsewhere.
  "onnxruntime-directml>=1.17; sys_platform == 'win32'",
  "onnxruntime>=1.17; sys_platform != 'win32'",
  "sentencepiece>=0.2",       # SigLIP text tokenizer
  "huggingface-hub>=0.23",    # fetch ONNX weights from the selects-onnx repo
  "insightface>=0.7",         # face detection/recognition (already ONNX-based)
  "opencv-python>=4.9,<5",    # insightface pulls opencv-python; 4.x required for the Haar cascade fallback (cv2.CascadeClassifier)
  "scikit-learn>=1.4",
  "hdbscan>=0.8.33",
  "umap-learn>=0.5.5",
  "requests>=2.31",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.26",
  "ruff>=0.15,<0.17",
]

[project.scripts]
selects = "selects.cli:main"

[tool.hatch.build]
# The built frontend lands in selects/server/static (gitignored). Force it into
# the sdist/wheel so `pip install selects` ships a working GUI, not just the API.
artifacts = ["selects/server/static/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["selects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# `ruff check .` from the repo root is the documented (and CI) command, so keep
# it away from vendored / generated / build trees.
extend-exclude = [
    "frontend",
    "vendor",
    "dist",
    "build",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501 (line-too-long) has ~80 pre-existing hits (mostly aligned inline
# comments in db/models.py and long test literals) that predate this pin;
# line-length stays 100 as the target for new code.
ignore = ["E501"]
