name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg (video decode/probe tests need ffprobe)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg inih ;;  # inih -> libINIReader, needed by pyexiv2's libexiv2
            Windows) choco install ffmpeg -y ;;
          esac
      - name: Cache insightface model pack
        uses: actions/cache@v4
        with:
          path: ~/.insightface
          key: insightface-buffalo_l
      - name: Install package + test deps (full ML stack)
        run: |
          # The suite exercises faces (insightface), model downloads (requests)
          # and clustering — all in the [ml] extra. Install it so tests don't
          # ModuleNotFoundError.
          pip install -e ".[ml,dev]"
      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check selects tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (strict TS)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No ML extra: the smoke library only needs the index + classical passes.
      - name: Install package + test deps
        run: pip install -e ".[dev]"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Run smoke test
        working-directory: frontend
        env:
          SELECTS_PYTHON: python
        run: npm run e2e
      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: frontend/test-results
          if-no-files-found: ignore
